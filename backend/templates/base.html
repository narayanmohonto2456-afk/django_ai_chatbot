<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Local AI Chatbot{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f8fafc; color: #111827; }
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; padding: 28px; background: white; border: 1px solid #e5e7eb; border-radius: 16px; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        .muted { color: #6b7280; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 600; }
        input { width: 100%; height: 42px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: white; color: #111827; font: inherit; }
        input:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
        button { width: 100%; min-height: 42px; margin-top: 22px; border: 0; border-radius: 8px; background: #111827; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #374151; }
        .footer { margin: 20px 0 0; text-align: center; font-size: 14px; }
        a { color: #1d4ed8; }
        .messages { margin: 0 0 18px; padding: 0; list-style: none; }
        .messages li { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: #fef2f2; color: #991b1b; font-size: 14px; }
        .messages li.success { background: #f0fdf4; color: #166534; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
